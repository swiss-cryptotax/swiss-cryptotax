name: Blog feed card

# Renders the latest posts of the cryptotax.ch blog with lowlighter/metrics
# and commits assets/metrics/blog-feed.svg when the list has changed.
# Only the public RSS feed is read. No GitHub token is passed to metrics.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: read

concurrency:
  group: blog-feed-card
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'swiss-cryptotax/swiss-cryptotax'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No "id" on this step: the action derives its docker image source from github.action.
      - name: Render blog feed card
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: blog-feed.svg
          output_action: none
          token: NOT_NEEDED
          committer_token: NOT_NEEDED
          user: swiss-cryptotax
          base: ""
          notice_releases: no
          plugins_errors_fatal: yes
          config_display: large
          config_animations: no
          config_padding: 0, 30 + 11%
          config_timezone: Europe/Zurich
          plugin_rss: yes
          plugin_rss_source: https://www.cryptotax.ch/en/blog-en/feed/
          plugin_rss_limit: 4

      - name: Commit card if changed
        run: |
          set -euo pipefail
          test -s /metrics_renders/blog-feed.svg
          cp /metrics_renders/blog-feed.svg assets/metrics/blog-feed.svg
          git add assets/metrics/blog-feed.svg
          rc=0
          git diff --cached --quiet || rc=$?
          case "$rc" in
            0) echo "Blog feed card unchanged."; exit 0 ;;
            1) ;;
            *) echo "git diff failed with exit code $rc"; exit "$rc" ;;
          esac
          git -c user.name=CryptoTax -c user.email=info@cryptotax.ch commit -m "Update blog feed card"
          git push origin HEAD:main
