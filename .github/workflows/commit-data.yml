name: Commit data received

# Lives on branch metrics, next to commits-daten.json. A push event runs the
# workflow files of the pushed commit, so a trigger for pushes to this branch
# has to be on this branch. The cards are rendered by metrics.yml on the
# default branch; this workflow only starts it.
#
# The daily count on the development machine pushes commits-daten.json with
# its own key. Pushes the workflows make with GITHUB_TOKEN start no run, and
# they do not touch commits-daten.json.

on:
  push:
    branches: [metrics]
    paths: [commits-daten.json]

permissions: {}

jobs:
  start:
    if: github.repository == 'swiss-cryptotax/swiss-cryptotax'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # workflow_dispatch is one of the two events a GITHUB_TOKEN may start.
      - name: Start metrics.yml on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          STANDARDZWEIG: ${{ github.event.repository.default_branch }}
        run: gh workflow run metrics.yml --repo "$GITHUB_REPOSITORY" --ref "$STANDARDZWEIG"
